{% extends "base.html" %}
{% block title %}Sign up - AeroMap AI{% endblock %}
{% block content %}
<div class="card auth">
  <h1>Create an account</h1>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post">
    <label for="username">Username</label>
    <input id="username" type="text" name="username" maxlength="80" required autofocus>
    <label for="email">Email</label>
    <input id="email" type="email" name="email" required>
    <label for="password">Password (at least 8 characters)</label>
    <input id="password" type="password" name="password" minlength="8" required>
    <p><button class="btn" type="submit">Sign up</button></p>
  </form>
  <p class="muted">Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
</div>
{% endblock %}
